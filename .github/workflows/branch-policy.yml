name: Branch policy

# main 으로는 develop(정기 배포) 또는 hotfix/*(긴급 수정)에서 온 PR 만 받습니다.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            develop|hotfix/*) echo "OK: $HEAD -> main" ;;
            *)
              echo "::error::main 으로는 develop 또는 hotfix/* 브랜치만 PR 할 수 있습니다 (현재: $HEAD). 먼저 develop 으로 PR 하세요."
              exit 1 ;;
          esac
